<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather-aware truck routing</title>
<style>
body{margin:0;font:14px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;height:100vh;color:#14232b}
aside{width:340px;padding:14px;overflow:auto;border-right:1px solid #d5dde1;background:#f6f8f9}
main{flex:1;display:flex;flex-direction:column;min-width:0}.map{flex:1}
h1{font-size:18px;margin:0 0 8px}label{display:block;margin:6px 0}
input,select,button{width:100%;padding:7px;box-sizing:border-box;font:inherit}
button{background:#0d5c63;color:#fff;border:0;border-radius:4px;margin-top:8px;cursor:pointer}button:disabled{opacity:.6}
.card{border:2px solid #d5dde1;border-radius:6px;padding:8px;margin:8px 0;cursor:pointer;background:#fff}.card.on{border-color:#0d5c63}
.tag{font-size:11px;padding:1px 7px;border-radius:8px;background:#2e9e5b;color:#fff;margin-left:6px}.tag.bad{background:#4a1020}
.bar{padding:10px 14px;border-top:1px solid #d5dde1}.err{color:#d6342c}
@media(max-width:700px){body{flex-direction:column;height:auto}aside{width:auto}.map{height:60vh}}
</style></head><body><div id="root" style="display:contents"></div><script type="module" src="/src/main.jsx"></script></body></html>
